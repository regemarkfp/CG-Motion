<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CG Motion</title>
<link rel="stylesheet" href="splash.css">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-app-region:drag}
#splash{border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.sp-logo{width:250px}.sp-in{margin-top:-40px;gap:7px}.sp-name{margin-top:12px}.sp-load{bottom:40px}</style>
</head>
<body>
<div id="splash"><div class="sp-in"><img src="logo.png" alt="RegemarkFP" class="sp-logo"><div class="sp-name">CG Motion</div><div class="sp-tag">Capturing life in motion</div><div class="sp-by">by RegemarkFP</div></div><div class="sp-load"><div class="sp-bar"><i></i></div><span id="sp-ver">Loading</span></div></div>
<script>
var v = /[?&]v=([^&]+)/.exec(location.search);
if (v) document.getElementById('sp-ver').textContent = 'Version ' + decodeURIComponent(v[1]).replace(/^(\d+\.\d+)\.0$/, '$1') + '  \u00b7  loading';
</script>
</body>
</html>
