# Builds CG Motion for Windows, macOS and Linux on GitHub's own machines.
#  · Every push: the installers are kept under the run's Artifacts (Actions tab).
#  · A version tag (v1.1, v1.2 …, which "Publish to GitHub.bat" makes): a GitHub Release with every installer, which
#    regemarkfp.com copies to its own downloads page by itself.
# Windows is signed as RegemarkFP when the secrets REGEMARKFP_PFX (base64 of the .pfx) and REGEMARKFP_PASSWORD exist.
name: Build CG Motion
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis portable --x64
          - os: macos-latest
            target: --mac dmg zip --x64 --arm64
          - os: ubuntu-latest
            target: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"; [[ "$v" =~ ^[0-9]+\.[0-9]+$ ]] && v="$v.0"
          npm version "$v" --no-git-tag-version --allow-same-version
      - name: Build
        shell: bash
        env:
          CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.REGEMARKFP_PFX || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.REGEMARKFP_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: CG-Motion-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CG Motion ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            docs/CG Motion Guide.pdf
